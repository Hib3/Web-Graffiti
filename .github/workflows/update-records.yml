name: Update Records

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: update-records
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install requests beautifulsoup4 lxml python-dateutil playwright
          python -m playwright install --with-deps chromium

      - name: Generate records
        env:
          OWNZYOU_MAX_PAGES: "2"
          OWNZYOU_DELAY_SECONDS: "2"
          ZONEXSEC_MAX_PAGES: "1"
          ZONEXSEC_DELAY_SECONDS: "2"
          ZONEH_MAX_PAGES: "1"
          ZONEH_DELAY_SECONDS: "2"
          DEFACERNET_MAX_PAGES: "1"
          DEFACERNET_DELAY_SECONDS: "2"
          HACKMIRROR_DELAY_SECONDS: "2"
          HACKMIRROR_TIMEOUT_SECONDS: "15"
          WEB_GRAFFITI_RECORD_LIMIT: "5000"
          WEB_GRAFFITI_MIN_RECORDS: "20"
          WEB_GRAFFITI_MIN_SUCCESSFUL_SOURCES: "1"
        run: python scripts/generate_records.py

      - name: Create archive thumbnails
        env:
          THUMBNAIL_LIMIT: "12"
        run: python scripts/create_thumbnails.py

      - name: Check records
        run: |
          python scripts/test_pipeline.py
          python scripts/check_records.py

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Commit updated records
        run: |
          if [ -z "$(git status --porcelain -- public/data public/thumbnails)" ]; then
            echo "No record changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/records.json public/data/source-status.json public/thumbnails
          git commit -m "Update defacement records"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
